services:
  - type: web
    name: remedy-setu
    runtime: node
    region: singapore
    rootDir: server
    buildCommand: npm run render-build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
